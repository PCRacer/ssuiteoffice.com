<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Media Player 🎬 👽 </title><style type="text/css">html,body{margin:0;padding:0;background-color:#000;height:100%;width:100%;background-image:url(images/D59.jpg);background-repeat:no-repeat;background-size:cover;background-position:center;font-family:Calibri,Arial,sans-serif;color:#fff}.player-container{text-align:center;padding-top:60px}.dropdown{position:relative;display:inline-block;width:60%;font-size:24px;cursor:pointer;user-select:none}.dropdown-toggle{background-color:rgb(128 128 128 / .2);backdrop-filter:blur(25px);color:#fff;padding:12px 20px;border:none;border-radius:10px;width:100%;text-align:center;text-shadow:1px 1px 0 #000;box-sizing:border-box}.dropdown-menu{position:absolute;background-color:rgb(43 80 110 / .7);backdrop-filter:blur(25px);width:100%;z-index:999;border-radius:11px;display:none;max-height:500px;overflow-y:auto;text-align:left;transition:all 0.5s ease}.dropdown-menu div{padding:12px 20px 14px 15px;cursor:pointer}.dropdown-menu div:hover{border-radius:9px;background-color:rgba(255,255,255,0.1);color:#fff;text-shadow:1px 1px 0 #000;transition:all 0.4s ease;box-shadow: 0px 0px 10px lightsteelblue inset}video,#youtubePlayerContainer{margin-top:40px;width:45%;margin-left:auto;margin-right:auto;display:block;height:485px}#youtubePlayerContainer{display:none}#youtubePlayerContainer iframe{width:100%;height:100%;border:none;background-color:#000}video{display:block}@media only screen and (max-width:1370px){.player-container{padding-top:25px}video,#youtubePlayerContainer{margin-top:25px;}}#play-toolbar{background:rgb(15 25 60 / .3);display:flex;position:absolute;bottom:50px;justify-content:center;gap:25px;padding:15px 0;user-select:none;border-top:1px solid rgb(70 130 230 / .3)}#play-toolbar button{position:fixed;bottom:-35px;left:20px;z-index:999;background-color:rgb(128 128 128 / .2);backdrop-filter:blur(25px);color:#fff;padding:8px 5px 12px 5px;border:none;border-radius:9px;text-align:center;text-shadow:1px 1px 0 #000;cursor:pointer;font-size:20px;width:180px;box-sizing:border-box;user-select:none;transition:all 0.4s ease;letter-spacing:1px}#play-toolbar button:hover{box-shadow:0px 0px 10px lightsteelblue inset}#play-toolbar button:focus {outline:2px solid #a0c4ff}#play-toolbar button.playing{background:rgb(70 130 230 / .8);box-shadow:0 0 25px rgb(70 130 230),inset 0 0 15px rgb(70 130 230 / .7);border-color:rgb(160 190 255);color:#d0e2ff}#equalizer-modal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgb(10 20 50 / .6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:1000}#equalizer-box{background:rgb(15 25 60 / .95);border:2px solid rgb(100 140 230 / .7);border-radius:20px;padding:0 40px 60px 40px;max-width:600px;text-align:center;color:#cce1ff;box-shadow:0 0 20px rgb(70 130 230 / .5);margin-top:-100px}#equalizer-box h2{font-size:1.8rem;font-weight:700;margin-bottom:20px;color:#e0ecff;position:relative;bottom:15px;letter-spacing:2px}#equalizer-sliders{display:flex;justify-content:space-around;margin-bottom:20px}.slider-container{display:flex;flex-direction:column;align-items:center;width:50px}.slider-container label{font-size:1rem;margin-top:10px;color:#a3bbff}input[type="range"][orient="vertical"]{writing-mode:bt-lr;writing-mode:vertical-lr;-ms-writing-mode:tb-lr;-webkit-writing-mode:vertical-lr;-moz-writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;-moz-appearance:slider-vertical;appearance:slider-vertical;width:8px;height:150px;background:rgb(10 30 80 / .7);border:1.5px solid rgb(100 140 230 / .8);border-radius:10px;box-shadow:0 0 10px rgb(100 140 230 / .6),inset 0 0 10px rgb(100 140 230 / .4);outline:none;transition:box-shadow 0.25s ease}input[type="range"][orient="vertical"]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;background:rgb(50 80 140 / .9);border:2px solid rgb(160 190 255);border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgb(100 140 230 / .9)}#equalizer-enable-container{display:flex;justify-content:center;align-items:center;margin-bottom:10px}#equalizer-enable{margin-right:10px;width:20px;height:20px;accent-color:rgb(100 140 230 / .8);cursor:pointer}#equalizer-enable-label{font-size:1.2rem;color:#a3bbff;font-weight:500;cursor:pointer;position:relative;bottom:1px}#equalizer-buttons{display:flex;justify-content:center;gap:20px;position:relative;top:15px}#equalizer-buttons button{background:rgb(10 30 80 / .7);border:1.5px solid rgb(100 140 230 / .8);border-radius:25px;padding:10px 20px;color:#a3bbff;font-weight:600;font-size:1.3rem;cursor:pointer;box-shadow:0 0 10px rgb(100 140 230 / .6),inset 0 0 10px rgb(100 140 230 / .4);transition:background 0.25s ease,box-shadow 0.25s ease;backdrop-filter:saturate(180%) blur(12px)}#equalizer-buttons button:hover{background:rgb(50 80 140 / .9);box-shadow:0 0 20px rgb(100 140 230 / .9),inset 0 0 15px rgb(100 140 230 / .7);color:#d0e2ff;border-color:rgb(160 190 255)}</style></head><body><div id="equalizer-modal" style="display:none"><div id="equalizer-box"><h2><span style="font-size:50px;position:relative;top:8px">🔊</span> 10-Band Equalizer</h2><div id="equalizer-sliders"><div class="slider-container"><input type="range" id="eq-32" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>32 Hz</label></div><div class="slider-container"><input type="range" id="eq-64" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>64 Hz</label></div><div class="slider-container"><input type="range" id="eq-125" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>125 Hz</label></div><div class="slider-container"><input type="range" id="eq-250" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>250 Hz</label></div><div class="slider-container"><input type="range" id="eq-500" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>500 Hz</label></div><div class="slider-container"><input type="range" id="eq-1000" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>1 kHz</label></div><div class="slider-container"><input type="range" id="eq-2000" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>2 kHz</label></div><div class="slider-container"><input type="range" id="eq-4000" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>4 kHz</label></div><div class="slider-container"><input type="range" id="eq-8000" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>8 kHz</label></div><div class="slider-container"><input type="range" id="eq-16000" min="-12" max="12" value="0" step="0.1" orient="vertical"><label>16 kHz</label></div></div><div id="equalizer-enable-container"><input type="checkbox" id="equalizer-enable"><label id="equalizer-enable-label" for="equalizer-enable" style="position:relative;bottom:1px;letter-spacing:1px">Enable Equalizer</label></div><div id="equalizer-buttons"><button id="eq-apply" style="margin-right:65px">&nbsp;Apply&nbsp;</button><button id="eq-reset" style="margin-right:65px">Reset to Default</button><button id="eq-cancel">Cancel</button></div></div></div><div class="player-container"><div class="dropdown" id="customDropdown" role="combobox" aria-haspopup="listbox" aria-expanded="false"><div class="dropdown-toggle" id="dropdownToggle" tabindex="0" aria-controls="dropdownMenu">Select a title to start playback...</div><div class="dropdown-menu" id="dropdownMenu" role="listbox"></div></div><video id="myVideo" controls autoplay preload="auto" poster="images/MediaPlayerBackground.jpg" crossorigin="anonymous">Your browser does not support HTML5 video.</video><div id="youtubePlayerContainer"></div></div><div id="play-toolbar"><button id="btn-equalizer" style="position:absolute;left:15px"><span style="font-size:24px">🔊 </span>Equalizer</button></div><script type="text/javascript" charset="utf-8">(function(){const videoList=["https://youtu.be/QfQCDGSL-rA?si=TrMRjOoFKu_ffGGD"];const DOMElements={equalizerBtn:document.getElementById("btn-equalizer"),equalizerModal:document.getElementById("equalizer-modal"),equalizerApply:document.getElementById("eq-apply"),equalizerReset:document.getElementById("eq-reset"),equalizerCancel:document.getElementById("eq-cancel"),equalizerEnable:document.getElementById("equalizer-enable"),confirmModal:document.getElementById("confirm-modal"),confirmMessage:document.getElementById("confirm-message"),confirmYes:document.getElementById("confirm-yes"),confirmNo:document.getElementById("confirm-no"),videoPlayer:document.getElementById("myVideo")};let appState={files:[],fileNames:[],currentIndex:-1,currentPlayer:null,audioContext:null,videoSourceNode:null,equalizerNodes:[],equalizerEnabled:!1,frequencies:[32,64,125,250,500,1000,2000,4000,8000,16000],};function setupEqualizer(){if(!appState.audioContext){try{appState.audioContext=new(window.AudioContext||window.webkitAudioContext)();appState.videoSourceNode=appState.audioContext.createMediaElementSource(DOMElements.videoPlayer);appState.equalizerNodes=appState.frequencies.map(freq=>{const filter=appState.audioContext.createBiquadFilter();filter.type="peaking";filter.frequency.setValueAtTime(freq,appState.audioContext.currentTime);filter.Q.setValueAtTime(1,appState.audioContext.currentTime);filter.gain.setValueAtTime(0,appState.audioContext.currentTime);return filter});if(appState.equalizerNodes.length>0){appState.equalizerNodes.reduce((prev,curr)=>{prev.connect(curr);return curr})}}catch(e){console.error("Error setting up AudioContext or equalizer:",e)}}}function connectEqualizer(player){if(!player||!appState.audioContext)return;try{if(appState.audioContext.state==="suspended"){appState.audioContext.resume().catch(e=>console.error("Error resuming AudioContext:",e))}if(appState.videoSourceNode){appState.videoSourceNode.disconnect()}if(appState.equalizerNodes.length>0){appState.equalizerNodes[appState.equalizerNodes.length-1].disconnect()}if(appState.equalizerEnabled&&appState.equalizerNodes.length>0){appState.videoSourceNode.connect(appState.equalizerNodes[0]);appState.equalizerNodes[appState.equalizerNodes.length-1].connect(appState.audioContext.destination)}else{appState.videoSourceNode.connect(appState.audioContext.destination)}}catch(e){console.error("Error connecting equalizer:",e)}}function updateEqualizerGains(){if(!appState.audioContext||!appState.equalizerEnabled){return}appState.frequencies.forEach((freq,i)=>{const slider=document.getElementById(`eq-${freq}`);if(slider&&appState.equalizerNodes[i]){appState.equalizerNodes[i].gain.setValueAtTime(parseFloat(slider.value),appState.audioContext.currentTime)}})}function saveEqualizerSettings(){const settings={enabled:DOMElements.equalizerEnable.checked,bands:appState.frequencies.reduce((acc,freq)=>{acc[freq]=document.getElementById(`eq-${freq}`).value;return acc},{})};localStorage.setItem("equalizerSettings",JSON.stringify(settings))}function loadEqualizerSettings(){const settings=JSON.parse(localStorage.getItem("equalizerSettings"));if(settings){DOMElements.equalizerEnable.checked=settings.enabled||!1;appState.equalizerEnabled=settings.enabled||!1;appState.frequencies.forEach(freq=>{const slider=document.getElementById(`eq-${freq}`);if(slider){slider.value=settings.bands[freq]||0}});updateEqualizerGains()}}function resetEqualizer(){appState.frequencies.forEach(freq=>{const slider=document.getElementById(`eq-${freq}`);if(slider){slider.value=0}});DOMElements.equalizerEnable.checked=!1;appState.equalizerEnabled=!1;updateEqualizerGains();saveEqualizerSettings();connectEqualizer(DOMElements.videoPlayer)}function initializeApp(){setupEqualizer();loadEqualizerSettings();DOMElements.equalizerBtn.addEventListener("click",()=>{DOMElements.equalizerModal.style.display="flex"});DOMElements.equalizerApply.addEventListener("click",()=>{appState.equalizerEnabled=DOMElements.equalizerEnable.checked;updateEqualizerGains();saveEqualizerSettings();connectEqualizer(DOMElements.videoPlayer);DOMElements.equalizerModal.style.display="none"});DOMElements.equalizerReset.addEventListener("click",resetEqualizer);DOMElements.equalizerCancel.addEventListener("click",()=>{DOMElements.equalizerModal.style.display="none";loadEqualizerSettings();connectEqualizer(DOMElements.videoPlayer)});DOMElements.equalizerEnable.addEventListener("change",()=>{appState.equalizerEnabled=DOMElements.equalizerEnable.checked;updateEqualizerGains();connectEqualizer(DOMElements.videoPlayer)});appState.frequencies.forEach(freq=>{const slider=document.getElementById(`eq-${freq}`);if(slider){slider.addEventListener("input",updateEqualizerGains)}});DOMElements.videoPlayer.addEventListener("canplay",()=>{if(appState.equalizerEnabled){connectEqualizer(DOMElements.videoPlayer)}else{if(appState.videoSourceNode&&appState.audioContext){appState.videoSourceNode.connect(appState.audioContext.destination)}}})}const dropdown=document.getElementById("customDropdown");const toggle=document.getElementById("dropdownToggle");const menu=document.getElementById("dropdownMenu");const videoElement=document.getElementById("myVideo");const youtubePlayerContainer=document.getElementById("youtubePlayerContainer");let currentVideoIndex=0;let ytPlayer;let youtubeAPIReady=false;function isYouTubeUrl(url){return url.includes("youtube.com/watch")||url.includes("youtu.be/")||url.includes("youtube.com/embed/");}function getYouTubeVideoId(url){if(typeof url!=="string")return"";let videoId="";const patterns=[/(?:\?|\&)v=([^&#]+)/,/youtu\.be\/([^?&#]+)/,/youtube\.com\/embed\/([^?&#]+)/];for(const pattern of patterns){const match=url.match(pattern);if(match&&match[1]){videoId=match[1];break}}return videoId.split("&")[0].split("#")[0]}window.onYouTubeIframeAPIReady=function(){youtubeAPIReady=true;if(window.pendingYouTubeVideoId){playYouTubeVideo(window.pendingYouTubeVideoId);window.pendingYouTubeVideoId=null;}};function loadYouTubeAPI(){if(!document.getElementById("youtube-iframe-api")){const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";tag.id="youtube-iframe-api";const firstScriptTag=document.getElementsByTagName("script")[0];firstScriptTag.parentNode.insertBefore(tag,firstScriptTag)}}function onPlayerReady(event){event.target.playVideo();const iframe=event.target.getIframe();if(iframe){iframe.setAttribute("allow","accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");iframe.setAttribute("allowfullscreen","");iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin")}}function onPlayerStateChange(event){if(event.data===YT.PlayerState.ENDED){console.log("YouTube video ended, playing next...");currentVideoIndex=(currentVideoIndex+1)%videoList.length;playVideo(currentVideoIndex)}}function playYouTubeVideo(videoId){if(ytPlayer){ytPlayer.loadVideoById(videoId)}else{const playerDiv=document.createElement("div");playerDiv.id="ytPlayerInstance";youtubePlayerContainer.innerHTML="";youtubePlayerContainer.appendChild(playerDiv);ytPlayer=new YT.Player("ytPlayerInstance",{height:"100%",width:"100%",videoId:videoId,playerVars:{"autoplay":1,"controls":1,"rel":0,"modestbranding":1,"playsinline":1},events:{"onReady":onPlayerReady,"onStateChange":onPlayerStateChange,"onError":(e)=>console.error("YouTube Player Error:",e)}})}}function playVideo(index){currentVideoIndex=index;const path=videoList[index];if(isYouTubeUrl(path)){const videoId=getYouTubeVideoId(path);toggle.textContent=`YouTube Video Playing: ${videoId}`;videoElement.style.display="none";videoElement.pause();videoElement.src="";youtubePlayerContainer.style.display="block";if(youtubeAPIReady){playYouTubeVideo(videoId)}else{window.pendingYouTubeVideoId=videoId;loadYouTubeAPI()}}else{toggle.textContent=path.split("/").pop().replace(/%20/g," ").split(".").slice(0,-1).join(".");if(ytPlayer){ytPlayer.stopVideo();ytPlayer.destroy();ytPlayer=null;youtubePlayerContainer.innerHTML=""}youtubePlayerContainer.style.display="none";videoElement.src=path.replace(/ /g,"%20");videoElement.load();if(appState.equalizerEnabled){connectEqualizer(videoElement)}else{connectEqualizer(videoElement);if(appState.videoSourceNode&&appState.audioContext){appState.videoSourceNode.connect(appState.audioContext.destination)}}videoElement.play().catch(error=>{console.error("HTML5 video autoplay failed:",error);toggle.textContent=`Playback blocked. Click to play: ${path.split("/").pop().replace(/%20/g, " ").split(".").slice(0, -1).join(".")}`});videoElement.style.display="block"}menu.style.display="none";dropdown.setAttribute("aria-expanded","false")}function createMenu(){const fragment=document.createDocumentFragment();videoList.forEach((videoPath,index)=>{const item=document.createElement("div");item.setAttribute("role","option");item.setAttribute("tabindex","-1");if(isYouTubeUrl(videoPath)){item.textContent=`YouTube Video: ${getYouTubeVideoId(videoPath)}`}else{item.textContent=videoPath.split("/").pop().replace(/%20/g," ")}item.dataset.videoIndex=index;fragment.appendChild(item)});menu.appendChild(fragment);initializeApp();}menu.addEventListener("click",(event)=>{const target=event.target;if(target.tagName==="DIV"&&target.hasAttribute("role","option")){const index=parseInt(target.dataset.videoIndex,10);if(!isNaN(index)){playVideo(index)}}});toggle.addEventListener("click",()=>{const isMenuOpen=menu.style.display==="block";menu.style.display=isMenuOpen?"none":"block";dropdown.setAttribute("aria-expanded",!isMenuOpen)});document.addEventListener("click",(event)=>{if(!dropdown.contains(event.target)){menu.style.display="none";dropdown.setAttribute("aria-expanded","false")}});videoElement.addEventListener("ended",()=>{currentVideoIndex=(currentVideoIndex+1)%videoList.length;playVideo(currentVideoIndex)});createMenu();})();</script></body></html></script></body></html>
